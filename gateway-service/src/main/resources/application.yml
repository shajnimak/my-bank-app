server:
  port: 8090

spring:
  application:
    name: gateway-service
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        format: YAML
      discovery:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
    gateway:
      server:
        webflux:
          routes:
            - id: accounts-service
              uri: lb://accounts-service
              predicates:
                - Path=/api/accounts,/api/accounts/me
              filters:
                - name: CircuitBreaker
                  args:
                    name: accounts-service
            - id: cash-service
              uri: lb://cash-service
              predicates:
                - Path=/api/cash
              filters:
                - name: CircuitBreaker
                  args:
                    name: cash-service
            - id: transfer-service
              uri: lb://transfer-service
              predicates:
                - Path=/api/transfer
              filters:
                - name: CircuitBreaker
                  args:
                    name: transfer-service
